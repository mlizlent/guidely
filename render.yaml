services:
  - type: web
    name: guidely
    env: python
    plan: starter
    buildCommand: |
      cd backend
      pip install -r requirements.txt
      cd ../frontend
      npm install
      npm run build
    startCommand: |
      cd backend
      uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: CHAT_MODEL
        value: qwen/qwen3.8-27b
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: DATA_DIR
        value: ./data
      - key: TOP_K
        value: "3"
      - key: CHUNK_SIZE_CHARS
        value: "800"
      - key: CHUNK_OVERLAP_CHARS
        value: "100"
      - key: CORS_ORIGINS
        value: '["*"]'
    root: backend
    disk:
      name: data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1