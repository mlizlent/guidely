services:
  - type: web
    name: guidely-backend
    env: python
    plan: starter
    buildCommand: |
      cd backend
      pip install -r requirements.txt
    startCommand: |
      cd backend
      uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: CHAT_MODEL
        value: qwen/qwen3.8-27b
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: DATA_DIR
        value: ./data
      - key: TOP_K
        value: "3"
      - key: CHUNK_SIZE_CHARS
        value: "800"
      - key: CHUNK_OVERLAP_CHARS
        value: "100"
      - key: CORS_ORIGINS
        value: '["https://guidely-frontend.onrender.com","http://localhost:5173","http://127.0.0.1:5173"]'
    disk:
      name: data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1

  - type: web
    name: guidely-frontend
    env: node
    plan: starter
    buildCommand: |
      npm install
      npm run build
    startCommand: npm run preview -- --port $PORT
    envVars:
      - key: VITE_API_BASE
        value: https://guidely-backend.onrender.com
    root: frontend