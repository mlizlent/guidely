services:
  - type: web
    name: guidely-docker
    plan: standard
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: CHAT_MODEL
        value: qwen/qwen3.8-27b
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: DATA_DIR
        value: ./data
      - key: TOP_K
        value: "3"
      - key: CHUNK_SIZE_CHARS
        value: "800"
      - key: CHUNK_OVERLAP_CHARS
        value: "100"
      - key: CORS_ORIGINS
        value: '["*"]'
    disk:
      name: data
      mountPath: /app/backend/data
      sizeGB: 1